[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A research Deep Agent with web search, long-term memory, and skills, deployable with LangGraph"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "deepagents==0.7.0",
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
    "langgraph==1.2.12",
    "langsmith==0.14.2",
    "tavily-python==0.8.4",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent"]
